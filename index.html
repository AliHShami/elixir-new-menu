<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>ELIXIR — Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3D4127">
<link rel="stylesheet" href="css/styles.css">
</head>

<body data-screen="intro">

<!-- Announces the current screen on every navigation. -->
<p id="live-region" class="sr-only" role="status" aria-live="polite"></p>


<!-- ── Fixed chrome. Never on the intro. Mirrors in RTL. ── -->
<button id="back-btn" class="chrome chrome--back" type="button" data-str-aria="back">
  <svg class="chrome__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<button id="info-btn" class="chrome chrome--info" type="button" data-str-aria="functions_open">
  <span aria-hidden="true">i</span>
</button>


<!-- ─────────────────────────  INTRO  ───────────────────────── -->
<section id="screen-intro" class="screen screen--fixed intro">
  <!-- The whole screen is the tap target; this transparent button carries it. -->
  <button id="intro-hit" class="intro__hit" type="button" data-str-aria="start"></button>

  <img class="intro__logo" src="assets/brand/elixir-logo.svg" alt="ELIXIR — functional phyto blends">

  <p class="intro__start u-caps" data-str="start"></p>
</section>


<!-- ──────────────────  THE NINE FUNCTIONS  ────────────────── -->
<section id="screen-functions" class="screen page" aria-labelledby="fn-head">
  <header class="page__head">
    <h1 id="fn-head" class="page__title" data-str="fn_head"></h1>
    <p class="page__sub" data-str="fn_sub"></p>
  </header>

  <div id="function-list" class="fn-list"></div>

  <p class="page__note" data-str="fn_note"></p>

</section>

<!-- Pinned to the foot of the functions screen, outside it so it can be fixed. -->
<div class="cta-bar">
  <button id="to-menu-btn" class="btn u-caps" type="button" data-str="see_menu"></button>
</div>


<!-- ────────────────────  THE CATEGORIES  ──────────────────── -->
<section id="screen-menu" class="screen page" aria-labelledby="menu-head">
  <header class="page__head">
    <h1 id="menu-head" class="page__title" data-str="menu_head"></h1>
    <p class="page__sub" data-str="menu_sub"></p>
  </header>

  <div id="category-list" class="cat-list"></div>
</section>


<!-- ───────────  ONE CATEGORY'S DRINKS  ─────────── -->
<section id="screen-category" class="screen page" aria-labelledby="cat-head">
  <header class="page__head">
    <h1 id="cat-head" class="page__title"></h1>
  </header>

  <p id="category-legend" class="legend"></p>

  <div id="drink-grid" class="drink-grid"></div>
</section>


<script src="js/app.js"></script>
</body>
</html>
